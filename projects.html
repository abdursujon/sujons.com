<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sujons.com - Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/fonts.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/project.css" rel="stylesheet" />
  </head>

  <body>
    <header id="header-placeholder"></header>

    <main>
      <section id="project-section-1" class="py-5 mt-5">
        <div class="container custom-container gradient-border mx-auto">
          <div class="row justify-content-center">
            <div class="col-md-6 d-flex flex-column justify-content-between mb-4 mb-md-0">
              <div class="position-relative project-image-div text-center">
                <img src="assets/projects/project 1/1.png" class="img-fluid" id="carousel-image" alt="Project image" />
              </div>
              <div class="control-div d-flex justify-content-center mt-3 gap-2">
                <button class="arrow-btn btn btn-outline-secondary" onclick="prevImage()" aria-label="Previous image">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <polyline points="15 18 9 12 15 6"></polyline>
                  </svg>
                </button>
                <button class="arrow-btn btn btn-outline-secondary" onclick="nextImage()" aria-label="Next image">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <polyline points="9 18 15 12 9 6"></polyline>
                  </svg>
                </button>
              </div>
              <div id="carousel-dots" class="mt-2 d-flex justify-content-center"></div>
            </div>

            <div class="col-md-6 d-flex flex-column justify-content-between">
              <div>
                <h2 id="project-title" class="fw-bold mb-3">Project Title Here</h2>
                <p id="project-desc" class="text-muted mb-2">
                  Project description goes here. Explain key features and functionality briefly.
                </p>
                <p id="tech-stack" class="text-muted mb-3">Tech Stack: HTML, CSS, JS, Bootstrap</p>
                <a id="launch-link" href="#" target="_blank" class="btn btn-dark mb-3">Launch</a>
              </div>
              <div class="d-flex justify-content-between mt-3">
                <button class="btn btn-outline-secondary" onclick="prevProject()">Previous Project</button>
                <button class="btn btn-outline-secondary" onclick="nextProject()">Next Project</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/project.js"></script>
  </body>
</html>
